[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly (pycodestyle errors + pyflakes + isort) rather than left
# to ruff's default selection, so a future ruff release changing its
# defaults can't silently start failing this repo's CI.
select = ["E4", "E7", "E9", "F", "I"]
